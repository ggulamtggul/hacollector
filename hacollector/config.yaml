name: "HA Collector"
version: "2.0.0"
slug: "hacollector"
description: "LG System Aircon (RS485) Collector with Auto Discovery"
url: "https://github.com/ggulamtggul/hacollector"
image: "ghcr.io/ggulamtggul/hacollector"
startup: application
init: false
arch:
  - aarch64
  - amd64
hassio_api: true
options:
  lg_server_ip: "192.168.0.100"
  lg_server_port: 8899
  mqtt_server: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  rooms: []
  auto_scan: true
  auto_scan_range: 16
  min_temp: 18
  max_temp: 30
  scan_interval: 20
  rs485_timeout: 2.0
  persistent_connection: true
  log_level: "info"
schema:
  lg_server_ip: str
  lg_server_port: int
  mqtt_server: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: str
  rooms:
    - name: str
      id: int
  auto_scan: bool
  auto_scan_range: int
  min_temp: int
  max_temp: int
  scan_interval: int
  rs485_timeout: float
  persistent_connection: bool
  log_level: str
map:
  - config:rw
  - data:rw
