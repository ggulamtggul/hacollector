name: Create New Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '새 버전 (예: 1.3.25 - v는 빼고 입력)'
        required: true
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 커밋 및 릴리즈 생성을 위한 권한
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Update Version Files
        run: |
          VERSION=${{ inputs.version }}
          echo "Bumping version to $VERSION"
          
          # config.yaml 수정
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" hacollector/config.yaml
          
          # consts.py 수정
          sed -i "s/^SW_VERSION *= *\".*\"/SW_VERSION          = \"$VERSION\"/" hacollector/consts.py

          # 변경 확인
          grep "version:" hacollector/config.yaml
          grep "SW_VERSION" hacollector/consts.py

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add hacollector/config.yaml hacollector/consts.py
          git commit -m "Bump version to ${{ inputs.version }}"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          name: Release v${{ inputs.version }}
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN }}
