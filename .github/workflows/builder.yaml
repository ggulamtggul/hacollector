name: Builder

env:
  BUILD_ARGS: ""
  MONITORED_FILES: "hacollector"

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.arch }} ${{ matrix.addon }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        addon: ["hacollector"]
        arch: [aarch64, amd64]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 릴리즈 태그 또는 푸시된 태그(v1.0.0)를 읽어서 파일 내부 버전(1.0.0)과 동기화
      - name: Sync version with Tag
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          # 태그 이름 가져오기 (예: v1.3.25)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME=${{ github.event.release.tag_name }}
          else
            TAG_NAME=${{ github.ref_name }}
          fi
          # 앞의 'v' 제거 (예: 1.3.25)
          VERSION=${TAG_NAME#v}
          echo "Syncing version to $VERSION"

          # 1. config.yaml 버전 수정 (hacollector/config.yaml)
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" hacollector/config.yaml
          
          # 2. consts.py 버전 수정 (hacollector/consts.py)
          # 공백 유연하게 대응 (SW_VERSION = "..." 패턴 찾아서 교체)
          sed -i "s/^SW_VERSION *= *\".*\"/SW_VERSION          = \"$VERSION\"/" hacollector/consts.py
          
          # 변경 확인
          grep "version:" hacollector/config.yaml
          grep "SW_VERSION" hacollector/consts.py

      - name: Build ${{ matrix.addon }} add-on
        uses: home-assistant/builder@2026.02.1
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target ${{ matrix.addon }} \
            --image "${{ matrix.addon }}/{arch}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon \
            --additional-tag latest
