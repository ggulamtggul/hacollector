name: Builder

on:
  release:
    types: [published]
  # 테스트용: main 브랜치 푸시 시 동작하게 하려면 아래 주석 해제
  # push:
  #   branches:
  #     - main

env:
  IMAGE_NAME: hacollector
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  # ── 1. 버전 동기화 (릴리즈 태그 → config.yaml & consts.py) ──────────────────
  sync-version:
    name: Sync version with release tag
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Sync version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          VERSION=${TAG_NAME#v}
          echo "Syncing version to $VERSION"

          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" hacollector/config.yaml
          sed -i "s/^SW_VERSION *= *\".*\"/SW_VERSION          = \"$VERSION\"/" hacollector/consts.py

          grep "version:" hacollector/config.yaml
          grep "SW_VERSION" hacollector/consts.py

      - name: Upload synced files
        uses: actions/upload-artifact@v4
        with:
          name: synced-source
          path: |
            hacollector/config.yaml
            hacollector/consts.py

  # ── 2. 빌드 매트릭스 초기화 ────────────────────────────────────────────────
  init:
    name: Initialize build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  # ── 3. 아키텍처별 이미지 빌드 ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.arch }} image
    needs: [sync-version, init]
    # sync-version가 skipped(push 이벤트)여도 진행
    if: always() && needs.init.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Apply synced version files (release only)
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: synced-source
          path: hacollector/

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
          push: ${{ github.event_name == 'release' && 'true' || 'false' }}
          version: ${{ github.event.release.tag_name || 'dev' }}

  # ── 4. 멀티 아키텍처 매니페스트 발행 ──────────────────────────────────────
  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
