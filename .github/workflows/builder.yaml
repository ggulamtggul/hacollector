name: Builder

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: hacollector

on:
  release:
    types: [published]

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  sync-version:
    name: Sync version with release tag
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract version
        id: version
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Syncing version to $VERSION"
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" hacollector/config.yaml
          sed -i "s/^SW_VERSION *= *\".*\"/SW_VERSION          = \"$VERSION\"/" hacollector/consts.py
          grep "version:" hacollector/config.yaml
          grep "SW_VERSION" hacollector/consts.py
      - name: Upload synced files
        uses: actions/upload-artifact@v4
        with:
          name: synced-source
          path: |
            hacollector/config.yaml
            hacollector/consts.py

  build:
    name: Build ${{ matrix.arch }} image
    needs: [init, sync-version]
    if: always() && needs.init.result == 'success'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Apply synced version files
        if: github.event_name == 'release'
        uses: actions/download-artifact@v4
        with:
          name: synced-source
          path: hacollector/
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.03.2
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
          push: ${{ github.event_name == 'release' && 'true' || 'false' }}
          version: ${{ github.event.release.tag_name || 'dev' }}

  manifest:
    name: Publish multi-arch manifest
    needs: [init, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.03.2
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: |
            ${{ github.event.release.tag_name }}
            latest
